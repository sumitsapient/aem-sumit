<style>
.float-container {
  margin-top: 12px;
    
}

.float-child {
    height: 252px;
    width: 218px;
    float: left;
    margin-right: 12px
    
} 
.float-child-one {
  height: 252px;
    width: 492px;
    float: left;
    
    
}
.asset {
    height: 248px;
    width: 215px;
}
.flex-container {
  
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: normal;
  align-items: normal;
  align-content: normal;
}

.flex-items:nth-child(1) {
  display: block;
  flex-grow: 0;
  flex-shrink: 1;
  flex-basis: auto;
  align-self: auto;
  order: 0;
  background: aliceblue;
  height: 124px;
  border-radius: 5px;
}

.flex-items:nth-child(2) {
  display: block;
  flex-grow: 0;
  flex-shrink: 1;
  flex-basis: auto;
  align-self: auto;
  order: 0;
  background: yellow;
  height: 124px;
  border-radius: 5px;
}
.flex-content {
  margin-left: 18px
}
</style>

<sly 
data-sly-use.template="core/wcm/components/commons/v1/templates.html"
data-sly-test.name="${properties.title}">
<div class="cmp-preview">
<b>${properties.title}</b>
   <div class="float-container">

  <div class="float-child">
    <div class="green"><img class="asset" src="${properties.asset}"/></div>
  </div>
  
  <div class="float-child-one">
    <div class="blue">
	<div class="flex-container">
   <div class="flex-items"><div class="flex-content">${properties.text @ context='html'}</div></div>
   <div class="flex-items"><div class="flex-content">${properties.callout @ context='html'}</div></div>
</div>
	
	</div>
  </div>
  
</div>
</div>
<sly data-sly-call="${template.placeholder @ isEmpty=!name, classAppend='cmp-preview'}"></sly>
