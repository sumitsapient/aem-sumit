<sly data-sly-template.caapMobile="${@ caap}">
<div class="col-md-12 smallview">
    <div id="carouselExampleIndicatorssmall" class="carousel slide" data-ride="carousel"
         data-wrap="false">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="row">
                    <sly  data-sly-repeat.grid="${caap.carouselActive}">
                        <sly data-sly-test="${gridList.first}">
                            <div class="col-sm-12 mb-3 ">
                                <div class="card-container">
                                    <div class="card-body">
                                        <div class="card-content">
                                            <div class="card-icon-container col-md-2 sol-sm-2">
                                                <img src="/etc.clientlibs/caap-learner/clientlibs/clientlib-site/resources/blue-icons/${grid.icon}.svg" />
                                            </div>
                                            <div class="resource-component-heading col-md-10">

                                                <div class="resources-component_resource-component-heading__text__3USKT body-medium">
                                                    <a href="${grid.linkTo}"
                                                       class="card-title-text"
                                                       tabindex="0">${grid.tileTitle}
                                                    </a>
                                                    <p class="card-sub-text">${grid.tileSummary}
                                                    </p>
                                                    <a href="${grid.linkTo}"
                                                       aria-label="read more about What Do I Do With Broken Links?"
                                                       class="resources-component_continue-link"
                                                       tabindex="0">${grid.linkText}</a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </sly>
                    </sly>
                </div>
            </div>
            <sly  data-sly-repeat.grid="${caap.allItem}">
                <sly data-sly-test="${!gridList.first}">
                    <div class="carousel-item">
                        <div class="row">
                            <div class="col-sm-12 mb-3 ">
                                <div class="card-container">
                                    <div class="card-body">
                                        <div class="card-content">
                                            <div class="card-icon-container col-md-2 sol-sm-2">
                                                <img src="/etc.clientlibs/caap-learner/clientlibs/clientlib-site/resources/blue-icons/${grid.icon}.svg" />
                                            </div>
                                            <div class="resource-component-heading col-md-10">

                                                <div class="resources-component_resource-component-heading__text__3USKT body-medium">
                                                    <a href="${grid.linkTo}"
                                                       class="card-title-text"
                                                       tabindex="0">${grid.tileTitle}
                                                    </a>
                                                    <p class="card-sub-text">${grid.tileSummary}
                                                    </p>
                                                    <a href="${grid.linkTo}"
                                                       aria-label="read more about What Do I Do With Broken Links?"
                                                       class="resources-component_continue-link"
                                                       tabindex="0">${grid.linkText}</a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </sly>
            </sly>

        </div>
    </div>
    <div class="col-12 text-right p-4">
        <a class="pagination-button left-btn" href="#carouselExampleIndicatorssmall"
           role="button" data-slide="prev" id="nextbtnsmall">
                                            <span>
                                                < </span>
        </a>
        <a class="pagination-button" href="#carouselExampleIndicatorssmall"
           role="button" data-slide="next" id="prevbtnsmall">
            <span>></span>
        </a>
    </div>
</div>
</sly>
